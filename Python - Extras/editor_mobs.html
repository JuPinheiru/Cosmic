<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>WZ Editor — Mobs</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #1a1a2e; color: #eee; font-family: Arial, sans-serif; }
header { background: #16213e; padding: 14px 32px; display: flex; align-items: center; gap: 16px; border-bottom: 2px solid #e94560; }
header h1 { color: #e94560; font-size: 20px; }
header a { color: #aaa; font-size: 12px; text-decoration: none; }
header a:hover { color: #e94560; }
.container { padding: 24px 32px; max-width: 1000px; margin: 0 auto; }
.search-area { display: flex; gap: 10px; margin-bottom: 20px; }
input[type=text] { background: #0f3460; color: #eee; border: 1px solid #444; padding: 9px 14px; border-radius: 6px; font-size: 14px; flex: 1; }
input[type=text]:focus { outline: none; border-color: #e94560; }
.results { background: #16213e; border: 1px solid #333; border-radius: 8px; max-height: 220px; overflow-y: auto; display: none; margin-bottom: 20px; }
.result-item { display: flex; align-items: center; gap: 10px; padding: 8px 14px; cursor: pointer; border-bottom: 1px solid #1a1a2e; }
.result-item:hover { background: #0f3460; }
.mob-card { background: #16213e; border: 1px solid #333; border-radius: 10px; padding: 20px; }
.mob-header { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 16px; }
.mob-header img { width: 60px; height: 60px; object-fit: contain; image-rendering: pixelated; }
.mob-header h2 { color: #e94560; font-size: 20px; }
.mob-header span { font-size: 11px; color: #555; }
.props-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
.prop-field { background: #0f3460; border-radius: 6px; padding: 8px 10px; }
.prop-label { font-size: 10px; color: #aaa; margin-bottom: 4px; }
.prop-row { display: flex; gap: 6px; align-items: center; }
.prop-row input { background: transparent; border: none; border-bottom: 1px solid #444; color: #f39c12; font-size: 14px; font-weight: bold; width: 100%; padding: 2px 0; }
.prop-row input:focus { outline: none; border-color: #e94560; }
.btn { background: #e94560; border: none; color: white; border-radius: 4px; padding: 3px 10px; font-size: 11px; cursor: pointer; white-space: nowrap; }
.btn:hover { background: #c73652; }
.btn.saved { background: #27ae60; }
.loading { text-align: center; padding: 40px; color: #aaa; }
.empty { color: #555; font-size: 13px; padding: 20px; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>👾 Mobs Editor</h1>
  <a href="/">← Voltar</a>
</header>
<div class="container">
  <div class="search-area">
    <input type="text" id="mob-search" placeholder="Buscar mob por nome ou ID...">
  </div>
  <div class="results" id="mob-results"></div>
  <div id="mob-detail"><div class="empty">Busque e selecione um mob acima.</div></div>
</div>

<script>
var searchTimer = null, currentMob = null;

document.getElementById('mob-search').addEventListener('input', function(){
    clearTimeout(searchTimer);
    var q = this.value.trim();
    if (q.length < 2) { document.getElementById('mob-results').style.display = 'none'; return; }
    searchTimer = setTimeout(function(){
        fetch('/api/mobs/search?q='+encodeURIComponent(q)).then(function(r){return r.json();}).then(function(d){
            var box = document.getElementById('mob-results');
            if (!d.mobs.length) { box.style.display = 'none'; return; }
            box.innerHTML = d.mobs.map(function(m){
                return '<div class="result-item" data-id="'+m.id+'">'
                    +'<img src="https://maplestory.io/api/GMS/83/mob/'+m.id+'/icon" style="width:32px;height:32px;object-fit:contain;image-rendering:pixelated;" onerror="this.style.opacity=0.2">'
                    +'<div><div style="font-size:13px;">'+m.name+'</div><div style="font-size:9px;color:#555;">ID: '+m.id+'</div></div>'
                    +'</div>';
            }).join('');
            box.style.display = 'block';
            box.querySelectorAll('.result-item').forEach(function(el){
                el.addEventListener('click', function(){
                    document.getElementById('mob-search').value = el.querySelector('div > div').textContent;
                    box.style.display = 'none';
                    loadMob(el.dataset.id);
                });
            });
        });
    }, 300);
});

function loadMob(mobId) {
    document.getElementById('mob-detail').innerHTML = '<div class="loading">Carregando...</div>';
    fetch('/api/mobs/'+mobId).then(function(r){return r.json();}).then(function(d){
        if (d.error) { document.getElementById('mob-detail').innerHTML = '<div class="empty">'+d.error+'</div>'; return; }
        currentMob = d;
        renderMob(d);
    });
}

function renderMob(d) {
    var html = '<div class="mob-card">';
    html += '<div class="mob-header">';
    html += '<img src="https://maplestory.io/api/GMS/83/mob/'+d.id+'/icon" onerror="this.style.opacity=0.2">';
    html += '<div><h2>'+d.name+'</h2><span>ID: '+d.id+'</span></div>';
    html += '</div>';
    html += '<div class="props-grid">';

    var fieldColors = {
        maxHP: '#e74c3c', maxMP: '#3498db', exp: '#f39c12',
        PADamage: '#e94560', MADamage: '#9b59b6',
        level: '#27ae60'
    };

    Object.keys(d.props).forEach(function(field){
        var p = d.props[field];
        var color = fieldColors[field] || '#f39c12';
        html += '<div class="prop-field">';
        html += '<div class="prop-label">'+field+'</div>';
        html += '<div class="prop-row">';
        html += '<input type="number" id="mob-'+field+'" value="'+p.value+'" style="color:'+color+'">';
        html += '<button class="btn" onclick="saveMob(\''+field+'\')">✓</button>';
        html += '</div></div>';
    });
    html += '</div></div>';
    document.getElementById('mob-detail').innerHTML = html;
}

function saveMob(field) {
    var inp = document.getElementById('mob-'+field);
    var btn = inp.parentElement.querySelector('.btn');
    btn.textContent = '...'; btn.disabled = true;

    fetch('/api/mobs/update', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({mob_id: currentMob.id, field: field, value: inp.value})
    }).then(function(r){return r.json();}).then(function(resp){
        if (resp.ok) { btn.classList.add('saved'); btn.textContent = '✓'; }
        else { btn.textContent = '✗'; }
        btn.disabled = false;
        setTimeout(function(){ btn.classList.remove('saved'); btn.textContent = '✓'; }, 1500);
    });
}
</script>
</body>
</html>
