<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>WZ Editor — CashShop</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #1a1a2e; color: #eee; font-family: Arial, sans-serif; }
header { background: #16213e; padding: 14px 32px; display: flex; align-items: center; gap: 16px; border-bottom: 2px solid #e94560; }
header h1 { color: #e94560; font-size: 20px; }
.wz-status { font-size: 11px; padding: 3px 10px; border-radius: 12px; font-weight: bold; }
.wz-status.ok  { background: #1a3a1a; color: #27ae60; border: 1px solid #27ae60; }
.wz-status.off { background: #2e1a1a; color: #e94560; border: 1px solid #e94560; }
.controls { padding: 14px 32px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; background: #16213e; border-bottom: 1px solid #333; }
select, input[type=text], input[type=number] { background: #0f3460; color: #eee; border: 1px solid #444; padding: 7px 12px; border-radius: 6px; font-size: 13px; }
input:focus, select:focus { outline: none; border-color: #e94560; }
.btn { background: #e94560; color: white; border: none; padding: 7px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; }
.btn:hover { background: #c73652; }
.btn.active { background: #27ae60; }
.btn.secondary { background: #0f3460; border: 1px solid #333; color: #aaa; }
.btn.secondary:hover { border-color: #e94560; color: #eee; }
.stats-bar { padding: 12px 32px; display: flex; gap: 28px; background: #0f3460; border-bottom: 1px solid #333; flex-wrap: wrap; }
.stat { text-align: center; }
.stat .value { font-size: 18px; font-weight: bold; color: #e94560; }
.stat .label { font-size: 10px; color: #aaa; }
#cs-grid { padding: 20px 32px; display: flex; flex-wrap: wrap; gap: 14px; }
.loading { text-align: center; padding: 60px; color: #aaa; font-size: 18px; width: 100%; }

/* Modal */
.modal-bg { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.78); z-index: 3000; align-items: center; justify-content: center; }
.modal-bg.open { display: flex; }
.modal { background: #16213e; border: 2px solid #e94560; border-radius: 12px; padding: 26px; width: 420px; max-height: 90vh; overflow-y: auto; }
.modal h2 { color: #e94560; font-size: 15px; margin-bottom: 18px; }
.field-label { font-size: 11px; color: #aaa; margin-bottom: 4px; }
.field-group { margin-bottom: 12px; }
.field-group input, .field-group select { width: 100%; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.search-results { background: #0f3460; border-radius: 6px; margin-top: 4px; max-height: 180px; overflow-y: auto; display: none; }
.search-result { display: flex; align-items: center; gap: 8px; padding: 6px 10px; cursor: pointer; border-bottom: 1px solid #1a1a2e; }
.search-result:hover { background: #16213e; }
.preview-box { display: none; background: #0f3460; border-radius: 8px; padding: 10px; margin-bottom: 14px; align-items: center; gap: 12px; }
.modal-btns { display: flex; gap: 10px; }
.modal-btns .btn { flex: 1; }
.msg { margin-top: 10px; font-size: 12px; text-align: center; }
</style>
</head>
<body>

<header>
  <h1>⚔ WZ Editor</h1>
  <span style="color:#aaa;font-size:13px;">CashShop — Commodity.img.xml</span>
  <a href="/" style="margin-left:auto;color:#aaa;font-size:12px;text-decoration:none;">← Voltar</a>
  <span id="wz-status" class="wz-status off" style="margin-left:auto;">WzEditor: verificando...</span>
</header>

<div class="controls">
  <input type="text" id="cs-search" placeholder="Buscar por nome ou ItemID..." style="width:220px">
  <select id="cs-cat">
    <option value="all">Todas categorias</option>
    <option value="Cap">Cap</option>
    <option value="Coat">Coat</option>
    <option value="Pants">Pants</option>
    <option value="Shoes">Shoes</option>
    <option value="Glove">Glove</option>
    <option value="Cape">Cape</option>
    <option value="Accessory">Accessory</option>
    <option value="Weapon">Weapon</option>
    <option value="Ring">Ring</option>
    <option value="Shield">Shield</option>
    <option value="Other">Other</option>
  </select>
  <button class="btn active" id="f-all">Todos</button>
  <button class="btn secondary" id="f-sale">On Sale</button>
  <button class="btn secondary" id="f-off">Off Sale</button>
  <button class="btn secondary" id="btn-add" style="margin-left:auto;">+ Adicionar Item</button>
</div>

<div class="stats-bar">
  <div class="stat"><div class="value" id="s-total">-</div><div class="label">Total SNs</div></div>
  <div class="stat"><div class="value" id="s-items">-</div><div class="label">Itens únicos</div></div>
  <div class="stat"><div class="value" id="s-onsale" style="color:#27ae60">-</div><div class="label">On Sale</div></div>
  <div class="stat"><div class="value" id="s-offsale" style="color:#aaa">-</div><div class="label">Off Sale</div></div>
</div>

<div id="cs-grid"><div class="loading">Carregando...</div></div>

<!-- Modal Adicionar -->
<div class="modal-bg" id="add-modal">
  <div class="modal">
    <h2>Adicionar Item ao CashShop</h2>
    <div class="field-group">
      <div class="field-label">Buscar item</div>
      <input type="text" id="add-search" placeholder="Nome ou ItemID...">
      <div class="search-results" id="add-results"></div>
    </div>
    <div class="preview-box" id="add-preview">
      <img id="add-img" src="" style="width:48px;height:48px;object-fit:contain;image-rendering:pixelated;" onerror="this.style.opacity=0.2">
      <div>
        <div id="add-name" style="font-size:13px;font-weight:bold;color:#eee;"></div>
        <div id="add-idlabel" style="font-size:10px;color:#555;"></div>
      </div>
    </div>
    <input type="hidden" id="add-itemid">
    <div class="grid2">
      <div class="field-group">
        <div class="field-label">Preço (NX)</div>
        <input type="number" id="add-price" value="1000" min="0">
      </div>
      <div class="field-group">
        <div class="field-label">Período (dias)</div>
        <input type="number" id="add-period" value="90" min="1">
      </div>
      <div class="field-group">
        <div class="field-label">Quantidade</div>
        <input type="number" id="add-count" value="1" min="1">
      </div>
      <div class="field-group">
        <div class="field-label">Gênero</div>
        <select id="add-gender">
          <option value="-1">Todos</option>
          <option value="0">Masculino</option>
          <option value="1">Feminino</option>
        </select>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px;">
      <input type="checkbox" id="add-onsale" checked style="width:16px;height:16px;cursor:pointer;">
      <label for="add-onsale" style="font-size:13px;cursor:pointer;">On Sale</label>
    </div>
    <div class="modal-btns">
      <button class="btn" id="add-confirm">Adicionar</button>
      <button class="btn secondary" id="add-cancel">Cancelar</button>
    </div>
    <div class="msg" id="add-msg"></div>
  </div>
</div>

<script>
var CASHSHOP = null, csFilter = 'all', wzEditorOk = false;

// ── Status do WzEditor ────────────────────────────────────────────────────────
fetch('/api/wz_status').then(function(r){return r.json();}).then(function(d){
    wzEditorOk = d.wz_editor_available;
    var el = document.getElementById('wz-status');
    if (wzEditorOk) {
        el.textContent = 'WzEditor: ativo (server + client)';
        el.className = 'wz-status ok';
    } else {
        el.textContent = 'WzEditor: só server (client não sincronizado)';
        el.className = 'wz-status off';
    }
});

// ── Filtros ───────────────────────────────────────────────────────────────────
document.getElementById('cs-search').addEventListener('input', renderCashShop);
document.getElementById('cs-cat').addEventListener('change', renderCashShop);
document.getElementById('f-all').addEventListener('click', function(){ setFilter('all'); });
document.getElementById('f-sale').addEventListener('click', function(){ setFilter('sale'); });
document.getElementById('f-off').addEventListener('click', function(){ setFilter('off'); });

function setFilter(f) {
    csFilter = f;
    document.getElementById('f-all').className  = 'btn' + (f==='all'  ? ' active' : ' secondary');
    document.getElementById('f-sale').className = 'btn' + (f==='sale' ? ' active' : ' secondary');
    document.getElementById('f-off').className  = 'btn' + (f==='off'  ? ' active' : ' secondary');
    renderCashShop();
}

// ── Load ──────────────────────────────────────────────────────────────────────
function loadCashShop() {
    document.getElementById('cs-grid').innerHTML = '<div class="loading">Carregando Commodity.img.xml...</div>';
    fetch('/api/commodity/items').then(function(r){return r.json();}).then(function(d){
        if (d.error) { document.getElementById('cs-grid').innerHTML = '<div class="loading" style="color:#e94560">Erro: '+d.error+'</div>'; return; }
        CASHSHOP = d.items;
        renderCashShop();
    });
}

// ── Render ────────────────────────────────────────────────────────────────────
function renderCashShop() {
    if (!CASHSHOP) return;
    var srch = document.getElementById('cs-search').value.toLowerCase();
    var cat  = document.getElementById('cs-cat').value;

    // Filtra e agrupa por ItemId
    var filtered = CASHSHOP.filter(function(it) {
        if (cat !== 'all' && it.category !== cat) return false;
        if (srch && it.name.toLowerCase().indexOf(srch) < 0 && (''+it.itemId).indexOf(srch) < 0) return false;
        return true;
    });
    var groups = {}, groupOrder = [];
    filtered.forEach(function(it) {
        if (!groups[it.itemId]) { groups[it.itemId] = []; groupOrder.push(it.itemId); }
        groups[it.itemId].push(it);
    });
    if (csFilter !== 'all') {
        groupOrder = groupOrder.filter(function(k) {
            if (csFilter === 'sale') return groups[k].some(function(x){ return x.onSale; });
            if (csFilter === 'off')  return groups[k].some(function(x){ return !x.onSale; });
        });
    }

    var onSale = CASHSHOP.filter(function(it){ return it.onSale; }).length;
    document.getElementById('s-total').textContent   = CASHSHOP.length;
    document.getElementById('s-items').textContent   = Object.keys(groups).length || groupOrder.length;
    document.getElementById('s-onsale').textContent  = onSale;
    document.getElementById('s-offsale').textContent = CASHSHOP.length - onSale;

    var html = '';
    for (var gi = 0; gi < groupOrder.length; gi++) {
        var itemId = groupOrder[gi];
        var sns    = groups[itemId];
        var name   = sns[0].name;
        var anyOn  = sns.some(function(x){ return x.onSale; });

        html += '<div style="background:#16213e;border:1px solid '+(anyOn?'#27ae60':'#444')+';border-radius:10px;padding:12px;min-width:210px;max-width:250px;">';
        // Header
        html += '<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">';
        html += '<img src="https://maplestory.io/api/GMS/83/item/'+itemId+'/icon" style="width:44px;height:44px;object-fit:contain;image-rendering:pixelated;flex-shrink:0;" onerror="this.style.opacity=0.2" loading="lazy">';
        html += '<div style="overflow:hidden;flex:1;">';
        html += '<div style="font-size:11px;font-weight:bold;color:#eee;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="'+name+'">'+name+'</div>';
        html += '<div style="font-size:9px;color:#555;">ItemID: '+itemId+'</div>';
        html += '<div style="font-size:9px;color:#aaa;">'+sns.length+' entrada'+(sns.length>1?'s':'')+'</div>';
        html += '</div></div>';

        // Linhas de SN
        for (var si = 0; si < sns.length; si++) {
            var it = sns[si];
            var gLabel = it.gender=='0'?'M':it.gender=='1'?'F':'All';
            var gColor = it.gender=='0'?'#3498db':it.gender=='1'?'#e91e8c':'#555';
            html += '<div style="background:'+(it.onSale?'#1a3a1a':'#1a1a2e')+';border:1px solid '+(it.onSale?'#27ae60':'#333')+';border-radius:6px;padding:7px 8px;margin-bottom:6px;">';
            // SN row + toggle
            html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;">';
            html += '<span style="font-size:9px;color:#555;">SN: '+it.sn+' <span style="color:'+gColor+';font-weight:bold;">'+gLabel+'</span></span>';
            html += '<div class="cs-toggle" data-sn="'+it.sn+'" data-onsale="'+(it.onSale?1:0)+'" title="'+(it.onSale?'Tirar de venda':'Colocar à venda')+'" style="width:10px;height:10px;border-radius:50%;background:'+(it.onSale?'#27ae60':'#555')+';cursor:pointer;flex-shrink:0;"></div>';
            html += '</div>';
            // Preço + Período
            html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:5px;">';
            html += '<div style="background:#0f3460;border-radius:4px;padding:3px 6px;"><div style="font-size:8px;color:#aaa;">Preço</div>';
            html += '<input class="cs-field" data-sn="'+it.sn+'" data-field="price" type="number" value="'+it.price+'" min="0" style="width:100%;background:transparent;border:none;color:#f39c12;font-size:11px;font-weight:bold;"></div>';
            html += '<div style="background:#0f3460;border-radius:4px;padding:3px 6px;"><div style="font-size:8px;color:#aaa;">Período</div>';
            html += '<input class="cs-field" data-sn="'+it.sn+'" data-field="period" type="number" value="'+it.period+'" min="1" style="width:100%;background:transparent;border:none;color:#3498db;font-size:11px;font-weight:bold;"></div>';
            html += '</div>';
            // Botões
            html += '<div style="display:flex;gap:4px;">';
            html += '<button class="cs-save btn secondary" data-sn="'+it.sn+'" style="flex:1;padding:3px 0;font-size:10px;">Salvar</button>';
            html += '<button class="cs-del" data-sn="'+it.sn+'" style="background:#2e1a1a;border:1px solid #e94560;color:#e94560;border-radius:4px;padding:3px 8px;font-size:10px;cursor:pointer;">✕</button>';
            html += '</div>';
            html += '</div>';
        }
        // Novo SN
        html += '<button class="cs-add-sn btn secondary" data-itemid="'+itemId+'" data-name="'+name+'" style="width:100%;margin-top:2px;padding:4px 0;font-size:10px;border-style:dashed;">+ novo SN</button>';
        html += '</div>';
    }

    document.getElementById('cs-grid').innerHTML = html || '<div class="loading">Nenhum item encontrado.</div>';
    bindEvents();
}

function bindEvents() {
    document.querySelectorAll('.cs-save').forEach(function(btn) {
        btn.addEventListener('click', function(){ saveCsItem(parseInt(btn.dataset.sn)); });
    });
    document.querySelectorAll('.cs-del').forEach(function(btn) {
        btn.addEventListener('click', function(){ deleteCsItem(parseInt(btn.dataset.sn)); });
    });
    document.querySelectorAll('.cs-toggle').forEach(function(dot) {
        dot.addEventListener('click', function(){ toggleOnSale(parseInt(dot.dataset.sn), dot.dataset.onsale==='1'); });
    });
    document.querySelectorAll('.cs-add-sn').forEach(function(btn) {
        btn.addEventListener('click', function(){
            openAddModal(parseInt(btn.dataset.itemid), btn.dataset.name);
        });
    });
}

// ── Ações ─────────────────────────────────────────────────────────────────────
function saveCsItem(sn) {
    var price  = document.querySelector('.cs-field[data-sn="'+sn+'"][data-field="price"]');
    var period = document.querySelector('.cs-field[data-sn="'+sn+'"][data-field="period"]');
    var it     = CASHSHOP.find(function(x){ return x.sn===sn; });
    var btn    = document.querySelector('.cs-save[data-sn="'+sn+'"]');
    btn.textContent = 'Salvando...'; btn.style.color = '#f39c12';
    fetch('/api/commodity/update', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({sn:sn, price:parseInt(price.value), period:parseInt(period.value), onSale:it.onSale})
    }).then(function(r){return r.json();}).then(function(resp){
        if (resp.ok) {
            it.price=parseInt(price.value); it.period=parseInt(period.value);
            btn.textContent = resp.client_synced ? '✓ Salvo (server+client)' : '✓ Salvo (só server)';
            btn.style.color = resp.client_synced ? '#27ae60' : '#f39c12';
        } else {
            btn.textContent = 'Erro!'; btn.style.color = '#e94560';
        }
        setTimeout(function(){ btn.textContent='Salvar'; btn.style.color=''; }, 2000);
    });
}

function toggleOnSale(sn, currentlyOn) {
    var it = CASHSHOP.find(function(x){ return x.sn===sn; });
    if (!it) return;
    fetch('/api/commodity/update', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({sn:sn, price:it.price, period:it.period, onSale:!currentlyOn})
    }).then(function(r){return r.json();}).then(function(resp){
        if (resp.ok) { it.onSale=!currentlyOn; renderCashShop(); }
    });
}

function deleteCsItem(sn) {
    var it = CASHSHOP.find(function(x){ return x.sn===sn; });
    if (!confirm('Remover "'+(it?it.name:'SN '+sn)+'" (SN: '+sn+') do CashShop?')) return;
    fetch('/api/commodity/remove', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({sn:sn})
    }).then(function(r){return r.json();}).then(function(resp){
        if (resp.ok) { CASHSHOP=CASHSHOP.filter(function(x){return x.sn!==sn;}); renderCashShop(); }
        else alert('Erro: '+(resp.error||''));
    });
}

// ── Modal Adicionar ───────────────────────────────────────────────────────────
document.getElementById('btn-add').addEventListener('click', function(){ openAddModal(); });
document.getElementById('add-cancel').addEventListener('click', closeAddModal);
document.getElementById('add-modal').addEventListener('click', function(e){ if(e.target===this) closeAddModal(); });

function openAddModal(itemId, name) {
    document.getElementById('add-modal').classList.add('open');
    document.getElementById('add-msg').textContent = '';
    if (itemId) {
        document.getElementById('add-itemid').value = itemId;
        document.getElementById('add-img').src = 'https://maplestory.io/api/GMS/83/item/'+itemId+'/icon';
        document.getElementById('add-name').textContent = name;
        document.getElementById('add-idlabel').textContent = 'ID: '+itemId;
        document.getElementById('add-preview').style.display = 'flex';
        document.getElementById('add-search').value = name;
        document.getElementById('add-results').style.display = 'none';
    } else {
        document.getElementById('add-itemid').value = '';
        document.getElementById('add-preview').style.display = 'none';
        document.getElementById('add-search').value = '';
        document.getElementById('add-results').style.display = 'none';
    }
}

function closeAddModal() {
    document.getElementById('add-modal').classList.remove('open');
}

var searchTimer = null;
document.getElementById('add-search').addEventListener('input', function() {
    clearTimeout(searchTimer);
    var q = this.value.trim();
    if (!q) { document.getElementById('add-results').style.display='none'; return; }
    searchTimer = setTimeout(function() {
        fetch('/api/search_item?q='+encodeURIComponent(q)).then(function(r){return r.json();}).then(function(d){
            var box = document.getElementById('add-results');
            if (!d.results || !d.results.length) { box.style.display='none'; return; }
            box.innerHTML = d.results.map(function(r){
                return '<div class="search-result" data-id="'+r.itemId+'" data-name="'+r.name+'" data-cat="'+r.category+'">'
                    +'<img src="https://maplestory.io/api/GMS/83/item/'+r.itemId+'/icon" style="width:28px;height:28px;object-fit:contain;image-rendering:pixelated;" onerror="this.style.opacity=0.2">'
                    +'<div><div style="font-size:12px;color:#eee;">'+r.name+'</div>'
                    +'<div style="font-size:9px;color:#555;">'+r.itemId+' | '+r.category+'</div></div>'
                    +'</div>';
            }).join('');
            box.style.display = 'block';
            box.querySelectorAll('.search-result').forEach(function(el) {
                el.addEventListener('click', function() {
                    var id=el.dataset.id, name=el.dataset.name;
                    document.getElementById('add-itemid').value = id;
                    document.getElementById('add-img').src = 'https://maplestory.io/api/GMS/83/item/'+id+'/icon';
                    document.getElementById('add-name').textContent = name;
                    document.getElementById('add-idlabel').textContent = 'ID: '+id;
                    document.getElementById('add-preview').style.display = 'flex';
                    document.getElementById('add-search').value = name;
                    box.style.display = 'none';
                });
            });
        });
    }, 300);
});

document.getElementById('add-confirm').addEventListener('click', function() {
    var itemId = document.getElementById('add-itemid').value;
    var msg    = document.getElementById('add-msg');
    if (!itemId) { msg.textContent='Selecione um item primeiro.'; msg.style.color='#e94560'; return; }
    fetch('/api/commodity/add', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
            itemId:  parseInt(itemId),
            price:   parseInt(document.getElementById('add-price').value),
            period:  parseInt(document.getElementById('add-period').value),
            count:   parseInt(document.getElementById('add-count').value),
            gender:  parseInt(document.getElementById('add-gender').value),
            onSale:  document.getElementById('add-onsale').checked,
        })
    }).then(function(r){return r.json();}).then(function(resp){
        if (resp.ok) {
            CASHSHOP.push({
                sn:resp.sn, itemId:parseInt(itemId),
                price:parseInt(document.getElementById('add-price').value),
                period:parseInt(document.getElementById('add-period').value),
                count:parseInt(document.getElementById('add-count').value),
                gender:document.getElementById('add-gender').value,
                onSale:document.getElementById('add-onsale').checked,
                name:resp.name, category:resp.category
            });
            renderCashShop();
            closeAddModal();
        } else {
            msg.textContent='Erro: '+(resp.error||'');
            msg.style.color='#e94560';
        }
    });
});

loadCashShop();
</script>
</body>
</html>
